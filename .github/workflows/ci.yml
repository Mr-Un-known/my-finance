name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run typecheck:e2e
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      # 'aislamiento' aparte: es el test de que los datos de una cuenta no
      # pasan a otra, y vive en su propio proyecto (dev server). Sin
      # nombrarlo aqui, CI no lo correria nunca.
      - run: npm run test:e2e -- --project=chromium --project=aislamiento
